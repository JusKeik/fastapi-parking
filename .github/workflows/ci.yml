name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        check:
          - flake8
          - isort
          - black
          - mypy
          - pytest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run flake8
        if: matrix.check == 'flake8'
        run: python -m flake8 .

      - name: Check import order
        if: matrix.check == 'isort'
        run: python -m isort --check-only --diff .

      - name: Check formatting
        if: matrix.check == 'black'
        run: python -m black --check --diff .

      - name: Check types
        if: matrix.check == 'mypy'
        run: python -m mypy app

      - name: Run tests
        if: matrix.check == 'pytest'
        run: python -m pytest -v